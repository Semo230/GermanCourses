    * { box-sizing: border-box; margin: 0; padding: 0; }

    [hidden] { display: none !important; }

    a, button { touch-action: manipulation; }

    a:focus-visible,

    /* Floating WhatsApp button (phones only) */

    .options {

    .option {

    .option[lang="de"] { direction: ltr; text-align: left; }

    .option:hover:not(:disabled) { border-color: var(--red); background: var(--white); }

    .option.correct { background: var(--green-bg); border-color: var(--green-text); color: var(--green-text); }

    .feedback {

    .result-links a { color: var(--red); font-weight: 700; }

  <a class="wa-float" href="https://wa.me/201212234806?text=%D8%A3%D9%87%D9%84%D8%A7%D9%8B%D8%8C%20%D8%B9%D9%86%D8%AF%D9%8A%20%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1%20%D8%B9%D9%86%20%D8%AF%D8%B1%D9%88%D8%B3%20%D8%A7%D9%84%D9%84%D8%BA%D8%A9%20%D8%A7%D9%84%D8%A3%D9%84%D9%85%D8%A7%D9%86%D9%8A%D8%A9."
     target="_blank" rel="noopener" aria-label="التواصل عبر واتساب">

  <script>
    // Quiz content: drafted by Claude, must be approved by Frau Asmaa before publishing.
    // In "text", German goes inside [[...]] so it is shown left-to-right in red.
    const QUESTIONS = [
      {
        text: "يعني إيه [[Guten Morgen]]؟",
        lang: "ar",
        options: ["مساء الخير", "صباح الخير", "مع السلامة", "تصبحوا على خير"],
        answer: 1,
        explain: "Morgen = الصبح، فـ Guten Morgen = صباح الخير.",
      },
      {
        text: "كمّلوا الجملة: [[Ich ___ Mona.]]",
        lang: "de",
        options: ["heißt", "heißen", "heiße", "heiß"],
        answer: 2,
        explain: "مع ich الفعل بياخد ‎-e في الآخر: Ich heiße Mona.",
      },
      {
        text: "حد سألكم [[Wie alt bist du?]] تردّوا بإيه؟",
        lang: "de",
        options: ["Ich komme aus Ägypten.", "Ich bin 14 Jahre alt.", "Ich heiße Ali.", "Mir geht's gut."],
        answer: 1,
        explain: "Wie alt bist du? = عندك كام سنة؟ والرد: Ich bin 14 Jahre alt.",
      },
      {
        text: "اختاروا أداة التعريف الصح: [[___ Buch ist neu.]]",
        lang: "de",
        options: ["Das", "Der", "Die", "Den"],
        answer: 0,
        explain: "كلمة Buch (كتاب) محايدة، فبنقول: das Buch.",
      },
      {
        text: "كمّلوا الجملة: [[Wir ___ in Kairo.]]",
        lang: "de",
        options: ["wohnt", "wohne", "wohnst", "wohnen"],
        answer: 3,
        explain: "مع wir الفعل بيرجع لأصله: wir wohnen.",
      },
      {
        text: "كمّلوا الجملة: [[Ich habe ___ Bruder.]]",
        lang: "de",
        options: ["ein", "einen", "eine", "einer"],
        answer: 1,
        explain: "Bruder مذكر، وبعد haben بيبقى مفعول به (Akkusativ)، فـ ein بتبقى einen.",
      },
      {
        text: "جمع كلمة [[das Kind]] (طفل) هو:",
        lang: "de",
        options: ["die Kinds", "die Kinde", "die Kinder", "die Kindern"],
        answer: 2,
        explain: "das Kind ← die Kinder.",
      },
      {
        text: "اختاروا كلمة السؤال الصح: [[___ fährst du am Wochenende? – Nach Alexandria.]]",
        lang: "de",
        options: ["Wohin", "Woher", "Wo", "Wann"],
        answer: 0,
        explain: "الرد Nach Alexandria (لإسكندرية)، يعني السؤال عن المكان اللي رايحين له: Wohin.",
      },
      {
        text: "كمّلوا الجملة: [[Gestern ___ ich ins Kino gegangen.]]",
        lang: "de",
        options: ["habe", "bin", "war", "hat"],
        answer: 1,
        explain: "gehen في الماضي التام (Perfekt) بييجي مع sein: ich bin gegangen.",
      },
      {
        text: "كمّلوا الجملة: [[Ich komme nicht, ___ ich krank bin.]]",
        lang: "de",
        options: ["denn", "aber", "weil", "und"],
        answer: 2,
        explain: "بعد weil الفعل بيروح آخر الجملة: weil ich krank bin.",
      },
    ];

    // Score ranges agreed in SPEC.md: 0-3, 4-7, 8-10.
    function resultFor(score) {
      if (score <= 3) {
        return {
          title: "ابدأوا من الأول",
          text: "مفيش أي مشكلة! كورس A1 هيبدأ معاكم من الصفر، خطوة بخطوة.",
          course: "A1",
        };
      }
      if (score <= 7) {
        return {
          title: "عندكم أساسيات",
          text: "عندكم بداية كويسة. كمّلوا مستوى A1 عشان تثبّتوا القواعد والمفردات.",
          course: "A1",
        };
      }
      return {
        title: "جاهزين لـ A2",
        text: "مستواكم كويس جدًا في أساسيات A1، وتقدروا تبدأوا كورس A2.",
        course: "A2",
      };
    }

    const questionView = document.getElementById("question-view");
    const resultView = document.getElementById("result-view");
    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("next-btn");
    const progressText = document.getElementById("progress-text");
    const progressBar = document.getElementById("progress-bar");
    const scoreText = document.getElementById("score-text");

    let current = 0;
    let score = 0;

    // Renders Arabic text with [[German]] parts wrapped in <bdi lang="de">.
    function setMixedText(el, text) {
      el.textContent = "";
      text.split(/(\[\[.*?\]\])/).forEach((part) => {
        if (part.startsWith("[[")) {
          const bdi = document.createElement("bdi");
          bdi.lang = "de";
          bdi.textContent = part.slice(2, -2);
          el.append(bdi);
        } else if (part) {
          el.append(part);
        }
      });
    }

    function showQuestion() {
      const q = QUESTIONS[current];
      progressText.textContent = "سؤال " + (current + 1) + " من " + QUESTIONS.length;
      scoreText.textContent = "الإجابات الصح: " + score;
      progressBar.style.width = (current / QUESTIONS.length) * 100 + "%";
      setMixedText(questionEl, q.text);

      optionsEl.textContent = "";
      q.options.forEach((option, i) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option";
        btn.textContent = option;
        if (q.lang === "de") btn.lang = "de";
        btn.addEventListener("click", () => choose(i));
        li.append(btn);
        optionsEl.append(li);
      });

      feedbackEl.hidden = true;
      nextBtn.hidden = true;
    }

    function choose(i) {
      const q = QUESTIONS[current];
      const buttons = optionsEl.querySelectorAll(".option");
      buttons.forEach((btn) => { btn.disabled = true; });
      buttons[q.answer].classList.add("correct");

      const isCorrect = i === q.answer;
      if (isCorrect) {
        score++;
      } else {
        buttons[i].classList.add("wrong");
      }
      scoreText.textContent = "الإجابات الصح: " + score;

      feedbackEl.className = "feedback " + (isCorrect ? "correct" : "wrong");
      feedbackEl.textContent = "";
      const heading = document.createElement("strong");
      heading.textContent = isCorrect ? "إجابة صح! 👏" : "مش مظبوطة، الإجابة الصح: " + q.options[q.answer];
      feedbackEl.append(heading, q.explain);
      feedbackEl.hidden = false;

      nextBtn.textContent = current === QUESTIONS.length - 1 ? "شوفوا النتيجة" : "السؤال اللي بعده";
      nextBtn.hidden = false;
      nextBtn.focus();
    }

    function showResult() {
      const result = resultFor(score);
      document.getElementById("final-score").textContent = score;
      document.getElementById("result-title").textContent = result.title;
      document.getElementById("result-text").textContent = result.text;

      const message = "أهلاً، عملت اختبار المستوى على صفحة Deutsch mit Asmaa وجبت " + score +
        " من 10 (" + result.title + "). عايز أعرف تفاصيل كورس " + result.course + ".";
      document.getElementById("result-wa").href =
        "https://wa.me/201212234806?text=" + encodeURIComponent(message);

      questionView.hidden = true;
      resultView.hidden = false;
      resultView.focus();
    }

    nextBtn.addEventListener("click", () => {
      current++;
      if (current < QUESTIONS.length) {
        showQuestion();
        questionEl.scrollIntoView({ block: "nearest" });
      } else {
        showResult();
      }
    });

    document.getElementById("restart-btn").addEventListener("click", () => {
      current = 0;
      score = 0;
      resultView.hidden = true;
      questionView.hidden = false;
      showQuestion();
    });

    showQuestion();
  </script>
