<!--
  Supabase → Authentication → Emails → Templates → "Confirm signup".
  Subject: أكّدوا حسابكم على Deutsch mit Asmaa
  The link goes to app/auth/confirm/route.ts (token_hash flow); redirect_to brings the student back to the page they signed up from.
  New text: Frau Asmaa approves it before launch (SPEC-2.md section 7).
-->
<div dir="rtl" style="font-family:Tahoma,Arial,sans-serif;font-size:16px;line-height:1.8;color:#3a2a1f;background:#f5ecdd;padding:24px">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:16px;padding:24px;border-top:6px solid #8b1a1a">
    <p>أهلاً بيكم في <span dir="ltr">Deutsch mit Asmaa</span>!</p>
    <p>اضغطوا على الزرار عشان تأكّدوا الإيميل وتبدأوا تستخدموا حسابكم:</p>
    <p style="text-align:center;margin:28px 0">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&redirect_to={{ .RedirectTo }}"
         style="display:inline-block;background:#8b1a1a;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 28px;border-radius:999px">تأكيد الحساب</a>
    </p>
    <p style="color:#6e5a4a;font-size:14px">لو ما عملتوش حساب على الموقع، تجاهلوا الإيميل ده.</p>
    <p style="margin-top:24px;color:#6e5a4a;font-size:14px" dir="ltr">Deutsch mit Asmaa Abd ElHamid</p>
  </div>
</div>
