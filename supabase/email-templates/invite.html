<!--
  Supabase → Authentication → Emails → Templates → "Invite user".
  Subject: Frau Asmaa عملت لكم حساب على Deutsch mit Asmaa
  Sent by supabase/functions/invite-student. The link goes to app/auth/confirm/route.ts, which sends
  type=invite on to /account/password to choose a password (the admin never sets or sees it).
  New text: Frau Asmaa approves it before launch (SPEC-2.md section 7).
-->
<div dir="rtl" style="font-family:Tahoma,Arial,sans-serif;font-size:16px;line-height:1.8;color:#3a2a1f;background:#f5ecdd;padding:24px">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:16px;padding:24px;border-top:6px solid #8b1a1a">
    <p>أهلاً بيكم!</p>
    <p><span dir="ltr">Frau Asmaa</span> عملت لكم حساب طالب على <span dir="ltr">Deutsch mit Asmaa</span>. من الحساب تقدروا تحجزوا الكورسات، وتتابعوا طلبات الحجز، وتشوفوا نتايج اختبار المستوى.</p>
    <p>اضغطوا على الزرار واختاروا كلمة سر لحسابكم:</p>
    <p style="text-align:center;margin:28px 0">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite"
         style="display:inline-block;background:#8b1a1a;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 28px;border-radius:999px">اختيار كلمة السر</a>
    </p>
    <p style="color:#6e5a4a;font-size:14px">لو مش متوقعين الإيميل ده، تجاهلوه.</p>
    <p style="margin-top:24px;color:#6e5a4a;font-size:14px" dir="ltr">Deutsch mit Asmaa Abd ElHamid</p>
  </div>
</div>
